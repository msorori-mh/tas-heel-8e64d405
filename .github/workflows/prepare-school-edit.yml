name: Prepare school edit migration
on: pull_request
permissions:
  contents: read
jobs:
  filename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - run: supabase migration new --help
      - run: supabase migration new school_directory_edit
