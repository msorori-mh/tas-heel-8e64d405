name: Subject cards mobile review
on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/home/SubjectGroupsGrid.tsx"
      - "src/components/student/SemesterSubjectsView.tsx"
      - "src/hooks/use-subject-downloads.ts"
      - "src/lib/subjects/subject-downloads.ts"
      - "tests/student/compact-subject-cards.test.tsx"
      - "tests/student/subject-downloads.test.ts"
      - "tests/e2e/subject-cards/**"
      - ".github/workflows/subject-cards.yml"
permissions:
  contents: read
concurrency:
  group: subject-cards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/student/compact-subject-cards.test.tsx tests/student/subject-downloads.test.ts tests/student/student-home-subject-card-ux-v2.static.test.mjs tests/student/student-home-services-closure-01.static.test.mjs tests/student/student-vitality-color-system-01.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npx vite build --config tests/e2e/subject-cards/vite.config.ts
      - run: node tests/e2e/subject-cards/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subject-cards-${{ github.sha }}
          path: artifacts/subject-cards
          if-no-files-found: error
