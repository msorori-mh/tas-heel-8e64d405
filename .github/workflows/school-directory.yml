name: School directory verification
on:
  push:
    branches: [feat/school-directory]
  pull_request:
    branches: [main]
    paths:
      - "src/lib/schools/**"
      - "src/components/schools/**"
      - "src/components/admin/SchoolDirectory.tsx"
      - "src/routes/complete-profile.tsx"
      - "src/components/student/EditProfileDialog.tsx"
      - "apps/teacher-academy/src/**"
      - "supabase/migrations/*school_directory*"
      - "tests/schools/**"
      - "tests/e2e/school-directory/**"
      - ".github/workflows/school-directory.yml"
permissions:
  contents: read
concurrency:
  group: school-directory-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: school_ci_only
          POSTGRES_DB: school_directory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: school_ci_only
      PGDATABASE: school_directory_test
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse migration, actual teacher save RPC, permissions and data preservation
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/schools/fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260911171430_school_directory_review.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260916010000_academy_teacher_profile_save_rpc.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/schools/directory.sql
      - name: Prove simultaneous approvals cannot duplicate the directory
        run: bash tests/schools/concurrency.sh
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit && npm run academy:typecheck
      - name: Test student completion, profile edit, school search and admin decisions
        run: npx vitest run tests/schools
      - name: Preserve teacher authentication contract
        run: node --test tests/teacher-academy/api-contract.test.mjs tests/teacher-academy/portal-google-auth-closure.test.mjs
      - name: Install browser for isolated UI tests
        run: npx playwright install --with-deps chromium
      - name: Build isolated UI fixtures
        run: npx vite build --config tests/e2e/school-directory/vite.config.ts
      - name: Verify mobile and desktop school workflows
        run: node tests/e2e/school-directory/verify.mjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-directory-${{ github.sha }}
          path: artifacts/school-directory
          if-no-files-found: error
