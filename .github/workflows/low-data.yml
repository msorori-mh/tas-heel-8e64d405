name: Student low-data reading
on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/offline/**"
      - "src/hooks/use-data-saver.ts"
      - "src/components/offline/**"
      - "src/components/lessons/*Pdf*"
      - "src/components/lessons/CachedFileUpdateNotice.tsx"
      - "src/components/lessons/LessonExplanations.tsx"
      - "src/components/lessons/LessonCapabilityTabs.tsx"
      - "tests/e2e/lesson-navigation/**"
      - "src/routes/_authenticated/lessons.$lessonId.tsx"
      - "tests/low-data/**"
      - "tests/e2e/low-data/**"
      - ".github/workflows/low-data.yml"
permissions:
  contents: read
concurrency:
  group: low-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/low-data tests/performance
      - run: npx playwright install --with-deps chromium
      - run: npx vite build --config tests/e2e/low-data/vite.config.ts
      - run: node tests/e2e/low-data/verify.mjs
      - run: npx vite build --config tests/e2e/lesson-navigation/vite.config.ts
      - run: node tests/e2e/lesson-navigation/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: low-data-${{ github.sha }}
          path: |
            artifacts/low-data
            artifacts/lesson-navigation
          if-no-files-found: error
