name: Web CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate non-breaking dependency lock remediation
        run: npm audit fix --package-lock-only --ignore-scripts || test $? -eq 1

      - name: Show generated dependency lock patch
        run: git diff -- package-lock.json

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests
        run: |
          npm test
          node --test tests/import/curriculum-subject-unit-lesson-intake-13j.static.test.mjs
          node --test tests/import/subject-textbook-grade-upload-13k.static.test.mjs
          node --test tests/security/student-textbook-governorate-track-13l.static.test.mjs
          node --test tests/security/curriculum-prelaunch-purge.static.test.mjs
          node --test tests/import/curriculum-readiness-subject-tracks-13n.static.test.mjs
          node --test tests/import/grade12-subject-catalog-initializer.static.test.mjs
          node --test tests/security/ministerial-cross-track-mufadala-parity-14i.static.test.mjs
          npm run test:question-bank-import
          node --experimental-strip-types --test tests/content-factory/content-factory-01.test.ts
          node --test tests/content-factory/content-factory-02-ui.static.test.mjs
          node --experimental-strip-types --test tests/content-factory/content-factory-03.test.ts
          node --test tests/content-factory/content-factory-03-ui.static.test.mjs
          node --test tests/content-factory/content-factory-04-contract.test.mjs
          node --test tests/content-factory/content-factory-05-api.static.test.mjs
          node --test tests/content-factory/content-factory-06-bundle.static.test.mjs
          node --import tsx --test tests/content-factory/content-factory-07-bundle.test.ts
          node --test tests/content-factory/content-factory-07.static.test.mjs
          node --test tests/content-factory/content-factory-08.static.test.mjs
          node --test tests/content-factory/content-factory-09.static.test.mjs
          node --test tests/content-factory/content-factory-10.static.test.mjs
          node --test tests/content-factory/content-factory-11-r8.static.test.mjs
          node --test tests/content-factory/content-factory-11-r10-intake.static.test.mjs
          node --test tests/content-factory/content-factory-11-r11-storage-policy.static.test.mjs
          node --test tests/content-factory/content-factory-11-r12-assets.static.test.mjs
          node --test tests/content-factory/content-factory-11-r13-owner-override.static.test.mjs
          node --import tsx --test tests/content-packages/chemistry-g12-iron-cf11-assets.test.ts

          if [ -f tests/content-packages/chemistry-g12-iron-v3.test.mjs ]; then
            node --test tests/content-packages/chemistry-g12-iron-v3.test.mjs
          fi
          node --experimental-strip-types --test tests/content-packages/chemistry-g12-iron-production-import-dry-run.test.ts

      - name: Run PWA service worker policy test
        run: node tests/pwa/service-worker-policy.static.test.mjs

      - name: Build client and server bundles
        run: npm run build

  content-v3-pg17:
    name: Content V3 disposable PG17 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start isolated PostgreSQL 17
        run: |
          docker run --detach --rm \
            --name tamkeen-content-v3-pg17 \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_PASSWORD=tamkeen_ci_only \
            --env POSTGRES_DB=tamkeen \
            postgres:17
          for attempt in {1..30}; do
            if docker exec tamkeen-content-v3-pg17 pg_isready --username postgres --dbname tamkeen; then
              exit 0
            fi
            sleep 1
          done
          docker logs tamkeen-content-v3-pg17
          exit 1

      - name: Run Content V3 PG17 fixture, migration, postverify, and runtime contract
        shell: pwsh
        env:
          TAMKEEN_PG17_LOCAL_URL: postgresql://postgres:tamkeen_ci_only@localhost:5432/tamkeen
        run: ./scripts/content-v3/pg17-runner.ps1

      - name: Stop isolated PostgreSQL 17
        if: always()
        run: docker stop tamkeen-content-v3-pg17 || true


  iron-ui-runtime:
    name: Iron seven-capability Chromium runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository and browser runtime
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated Iron preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory content-packages/chemistry-g12-iron-v3 > /tmp/iron-preview.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/preview/student.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/iron-preview.log
          exit 1

      - name: Run Iron UI and CSP gate
        env:
          IRON_PREVIEW_BASE_URL: http://127.0.0.1:4173
        run: node tests/content-packages/chemistry-g12-iron-v3-ui-runtime.mjs

      - name: Upload Iron UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iron-ui-runtime-evidence
          path: artifacts/iron-ui-runtime
          if-no-files-found: error


  content-factory-pg17:
    name: Content Factory persistent staging PG17
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify PostgreSQL client
        run: psql --version

      - name: Start isolated PostgreSQL 17
        run: |
          docker run --detach --rm --name tamkeen-content-factory-pg17 --publish 127.0.0.1:5432:5432 --env POSTGRES_PASSWORD=tamkeen_cf_ci_only --env POSTGRES_DB=tamkeen_cf postgres:17
          for attempt in {1..30}; do
            if docker exec tamkeen-content-factory-pg17 pg_isready --username postgres --dbname tamkeen_cf; then exit 0; fi
            sleep 1
          done
          docker logs tamkeen-content-factory-pg17
          exit 1

      - name: Rehearse CF04-CF09 staging, RLS, identity, and idempotency
        env:
          CONTENT_FACTORY_PG17_URL: postgresql://postgres:tamkeen_cf_ci_only@localhost:5432/tamkeen_cf
        run: bash scripts/content-factory/pg17/rehearse-content-factory-04.sh

      - name: Rehearse the full CF04-CF11 publication chain on a clean database
        env:
          CONTENT_FACTORY_PG17_URL: postgresql://postgres:tamkeen_cf_ci_only@localhost:5432/tamkeen_cf11
        run: |
          docker exec tamkeen-content-factory-pg17 \
            psql --username postgres --dbname postgres --command 'CREATE DATABASE tamkeen_cf11'
          bash scripts/content-factory/pg17/rehearse-content-factory-11.sh

      - name: Verify gated prelaunch curriculum purge on isolated PG17
        env:
          CURRICULUM_PURGE_PG17_URL: postgresql://postgres:tamkeen_cf_ci_only@localhost:5432/tamkeen_purge
        run: |
          docker exec tamkeen-content-factory-pg17 \
            psql --username postgres --dbname postgres --command 'CREATE DATABASE tamkeen_purge'
          psql "$CURRICULUM_PURGE_PG17_URL" --set=ON_ERROR_STOP=1 \
            --file scripts/curriculum/pg17-prelaunch-purge-fixture.sql \
            --file supabase/migrations/20260824223000_prelaunch_curriculum_global_purge.sql \
            --file supabase/migrations/20260824231500_prelaunch_purge_pgcrypto_schema_fix.sql \
            --file supabase/migrations/20260824234000_prelaunch_purge_safeupdate_final.sql \
            --file supabase/migrations/20260825020000_prelaunch_content_global_reset_v2.sql \
            --file scripts/curriculum/pg17-prelaunch-purge-assert.sql

      - name: Verify Grade 12 subject catalog initializer on isolated PG17
        env:
          GRADE12_CATALOG_PG17_URL: postgresql://postgres:tamkeen_cf_ci_only@localhost:5432/tamkeen_grade12
        run: |
          docker exec tamkeen-content-factory-pg17 \
            psql --username postgres --dbname postgres --command 'CREATE DATABASE tamkeen_grade12'
          psql "$GRADE12_CATALOG_PG17_URL" --set=ON_ERROR_STOP=1 \
            --file scripts/curriculum/pg17-grade12-subject-catalog-fixture.sql \
            --file supabase/migrations/20260830010000_grade12_subject_catalog_initializer.sql \
            --file scripts/curriculum/pg17-grade12-subject-catalog-assert.sql

      - name: Stop isolated PostgreSQL 17
        if: always()
        run: docker stop tamkeen-content-factory-pg17 || true
