name: Student audit regression
on:
  pull_request:
    branches: [main, feat/compact-subject-cards]
permissions:
  contents: read
concurrency:
  group: student-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:core-reliability
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/student-audit tests/mobile/session-restore
      - run: npx playwright install --with-deps chromium
      - run: npx vite build --config tests/e2e/student-audit/vite.config.ts
      - run: node tests/e2e/student-audit/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-audit-${{ github.sha }}
          path: artifacts/student-audit-browser
          if-no-files-found: error
