name: Independence runtime and inventory
on:
  pull_request:
    paths:
      - "src/lib/*ocr*"
      - "src/integrations/**"
      - "scripts/independent/**"
      - "scripts/academy/build-offline-shell.mjs"
      - "src/lib/auth/native-oauth.ts"
      - "src/lib/network/**"
      - "tests/mobile/independent-staging-auth.runtime.test.ts"
      - "vite*.config.ts"
      - "package*.json"
      - "bun.lock"
      - "tests/independent*/**"
      - ".github/workflows/independence-closure.yml"
      - ".github/workflows/independent-staging.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: TEST_ONLY
          POSTGRES_DB: independent_fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d independent_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TAMKEEN_STAGING_ORIGIN: https://tamkeen-independent-test.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:independent
      - run: npx vitest run tests/independent-runtime/ocr-disabled.test.ts
      - name: Verify inventory against disposable PostgreSQL
        env:
          INVENTORY_TEST_DATABASE_URL: postgres://postgres:TEST_ONLY@localhost:5432/independent_fixture
        run: node --test tests/independent-pg/inventory.test.mjs
      - name: Verify keyed row comparison against disposable PostgreSQL
        env:
          PGPASSWORD: TEST_ONLY
          PARITY_TEST_DATABASE_URL: postgres://postgres:TEST_ONLY@localhost:5432/independent_rows_fixture
        run: |
          createdb -h localhost -U postgres independent_rows_fixture
          node --test tests/independent/row-parity.test.mjs
      - run: npm run build:independent
      - run: node scripts/independent/verify-build.mjs
      - run: node scripts/independent/smoke-build.mjs
      - name: Verify independent native assets and offline cold restart
        env:
          TAMKEEN_NATIVE_SHELL: "1"
        run: |
          npm run build:independent
          node scripts/independent/verify-build.mjs
          node scripts/independent/package-native-shell.mjs
          npx playwright install --with-deps chromium
          npm run test:native-shell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-cold-start-evidence
          path: artifacts/native-shell/
          retention-days: 14
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAMKEEN_DEPLOYMENT_ENV: production
      TAMKEEN_PRODUCTION_ORIGIN: https://studentamkeen.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:independent
      - run: node scripts/independent/verify-build.mjs
      - run: node scripts/independent/smoke-build.mjs
