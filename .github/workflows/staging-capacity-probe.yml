name: Temporary staging capacity probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging-capacity-probe
  cancel-in-progress: true

jobs:
  capacity:
    if: github.head_ref == 'feat/staging-launch-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run read-only staging capacity gate
        env:
          LOAD_TARGET_URL: https://qwfvlppsffcmmbjpznkw.supabase.co
          LOAD_PUBLISHABLE_KEY: sb_publishable_G1MUBWznr_NZ1DYYOnmOcQ_YZruG_vs
          LOAD_REPORT_PATH: artifacts/capacity-github.json
          LOAD_TIMEOUT_MS: 8000
        run: |
          mkdir -p artifacts
          npm run test:load:staging
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-capacity-evidence
          path: artifacts/capacity-github.json
