name: Golden Lesson identity rebind PG17

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: golden-identity-rebind-pg17-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  golden-identity-rebind-pg17:
    name: Golden identity preflight and DRAFT rebind PG17
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start isolated PostgreSQL 17
        run: |
          docker run --detach --rm \
            --name tamkeen-golden-identity-pg17 \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_PASSWORD=tamkeen_identity_ci_only \
            --env POSTGRES_DB=tamkeen_identity \
            postgres:17
          for attempt in {1..30}; do
            if docker exec tamkeen-golden-identity-pg17 pg_isready --username postgres --dbname tamkeen_identity; then
              exit 0
            fi
            sleep 1
          done
          docker logs tamkeen-golden-identity-pg17
          exit 1

      - name: Rehearse identity correction and fail-closed guards
        env:
          GOLDEN_IDENTITY_PG17_URL: postgresql://postgres:tamkeen_identity_ci_only@localhost:5432/tamkeen_identity
        run: bash scripts/content-factory/pg17/rehearse-golden-identity-rebind.sh

      - name: Stop isolated PostgreSQL 17
        if: always()
        run: docker stop tamkeen-golden-identity-pg17 || true
