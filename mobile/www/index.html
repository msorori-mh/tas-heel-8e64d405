<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" />
    <title>تمكين — دون اتصال</title>
    <!--
      21B4-B — Tamkeen Offline Entry.

      Bundled inside the APK. Zero remote dependencies: no remote CSS/JS/fonts/
      images, no Supabase, no fetch, no signed URL. It only talks to the native
      TamkeenPdfViewer plugin over the Capacitor bridge:
        listSavedTextbooks() → display metadata for OFFLINE_READY books
        openTextbook({ textbookId }) → native viewer reads the app-private file
      No filesystem path is ever produced or accepted by this page.
    -->
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, "Segoe UI", sans-serif;
        background: #FAFAFF;
        color: #0F0B2E;
        padding: 24px 18px 40px;
      }
      header { text-align: center; margin-bottom: 22px; }
      h1 { font-size: 22px; margin: 0 0 10px; }
      .lead { font-size: 14px; color: #605B8A; margin: 0 auto; max-width: 340px; line-height: 1.8; }
      h2 { font-size: 15px; margin: 26px 0 10px; }
      .card {
        background: #fff;
        border: 1px solid #E7E4F5;
        border-radius: 16px;
        padding: 14px;
        margin-bottom: 12px;
        box-shadow: 0 1px 2px rgba(15, 11, 46, .05);
      }
      .title { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
      .meta { font-size: 12px; color: #605B8A; margin: 0 0 12px; }
      button {
        font: inherit;
        border: 0;
        border-radius: 12px;
        padding: 11px 16px;
        width: 100%;
        cursor: pointer;
      }
      .primary { background: #5B4BFF; color: #fff; font-weight: 700; }
      .ghost { background: transparent; color: #5B4BFF; border: 1px solid #CFC9F7; }
      .empty { font-size: 13px; color: #605B8A; line-height: 1.9; }
      .error { color: #B3261E; font-size: 13px; margin-top: 10px; min-height: 18px; }
      footer { margin-top: 26px; }
    </style>
  </head>
  <body>
    <header>
      <h1>تمكين</h1>
      <p class="lead">أنت غير متصل بالإنترنت. يمكنك متابعة قراءة الكتب التي حفظتها على هذا الجهاز.</p>
    </header>

    <main>
      <h2>كتبك المحفوظة</h2>
      <div id="books" class="card empty">جارٍ قراءة الكتب المحفوظة…</div>
      <p id="error" class="error" role="alert"></p>
    </main>

    <footer>
      <button id="retry" class="ghost" type="button">إعادة المحاولة</button>
    </footer>

    <script>
      (function () {
        var ORIGIN = "https://studentamkeen.com";
        var booksEl = document.getElementById("books");
        var errorEl = document.getElementById("error");

        function bridge() {
          // Root cause of the old `triggerEvent` crash: calling into the
          // Capacitor bridge on a page where it was never injected. Always
          // resolve defensively and degrade to a readable message.
          var cap = window.Capacitor;
          if (!cap || !cap.Plugins || !cap.Plugins.TamkeenPdfViewer) return null;
          return cap.Plugins.TamkeenPdfViewer;
        }

        function showEmpty() {
          booksEl.className = "card empty";
          booksEl.textContent =
            "لا توجد كتب محفوظة على هذا الجهاز حتى الآن. اتصل بالإنترنت ونزّل كتاباً أولاً لاستخدامه دون اتصال.";
        }

        function label(book) {
          var parts = [];
          if (book.subjectLabel) parts.push(book.subjectLabel);
          if (book.bookType === "EXERCISE_BOOK") parts.push("كتاب التمارين");
          else if (book.bookType === "OTHER") parts.push("ملحق");
          else parts.push("الكتاب الأساسي");
          if (book.coverageLabel) parts.push(book.coverageLabel);
          return parts.join(" · ");
        }

        function render(books) {
          if (!books || !books.length) return showEmpty();
          booksEl.replaceWith(buildList(books));
        }

        function buildList(books) {
          var wrap = document.createElement("div");
          wrap.id = "books";
          books.forEach(function (book) {
            var card = document.createElement("section");
            card.className = "card";

            var h3 = document.createElement("p");
            h3.className = "title";
            h3.textContent = book.title || "كتاب المنهج";

            var meta = document.createElement("p");
            meta.className = "meta";
            meta.textContent = label(book);

            var btn = document.createElement("button");
            btn.className = "primary";
            btn.type = "button";
            btn.textContent = "فتح الكتاب";
            btn.addEventListener("click", function () {
              openBook(book.textbookId, btn);
            });

            card.appendChild(h3);
            card.appendChild(meta);
            card.appendChild(btn);
            wrap.appendChild(card);
          });
          return wrap;
        }

        function openBook(textbookId, btn) {
          var plugin = bridge();
          errorEl.textContent = "";
          if (!plugin || !textbookId) {
            errorEl.textContent = "تعذر فتح النسخة المحفوظة. اتصل بالإنترنت وأعد تنزيل الكتاب.";
            return;
          }
          btn.disabled = true;
          // Only a trusted identifier crosses the bridge — never a path.
          plugin
            .openTextbook({ textbookId: textbookId })
            .catch(function () {
              errorEl.textContent =
                "تعذر فتح النسخة المحفوظة. اتصل بالإنترنت وأعد تنزيل الكتاب.";
            })
            .then(function () {
              btn.disabled = false;
            });
        }

        function load() {
          var plugin = bridge();
          if (!plugin) return showEmpty();
          plugin
            .listSavedTextbooks()
            .then(function (res) {
              render((res && res.books) || []);
            })
            .catch(function () {
              showEmpty();
            });
        }

        document.getElementById("retry").addEventListener("click", function () {
          window.location.href = ORIGIN;
        });

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", load);
        } else {
          load();
        }
      })();
    </script>
  </body>
</html>
