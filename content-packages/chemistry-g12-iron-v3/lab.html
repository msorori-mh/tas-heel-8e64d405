<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';style-src 'unsafe-inline';script-src 'self' 'sha256-YU71qk3FsmNeIIYALoQRDblnaTpnA6Qg7pvxs7PfEyo=';img-src 'self' data:;connect-src 'none'"><style>body{margin:0;background:#f8f3ea;color:#172033;font-family:Segoe UI,Tahoma,Arial,sans-serif;line-height:1.8}main{max-width:720px;margin:auto;padding:16px}button,select{font:inherit;padding:8px;margin:4px;border:1px solid #b98b67;border-radius:8px;background:#fff}#result{margin-top:12px;padding:12px;background:#fff7dc;border-right:4px solid #b46a22}.model{font-size:.9rem;color:#6e2d18}</style></head><body><main><h1>الكشف عن الحديد في أملاحه</h1><p>اختر أيون الحديد ثم أضف الكاشف لعرض الملاحظة.</p><label for="ion">الأيون</label><select id="ion"><option>Fe2+</option><option>Fe3+</option></select><button id="run" type="button">إجراء الاختبار</button><div id="result" aria-live="polite">لم يبدأ الاختبار.</div><p class="model"><strong>TAMKEEN_SIMULATION_MODEL:</strong> الألوان والنتيجة المعروضة نموذج محاكاة تعليمية وليست قياساً مخبرياً رسمياً.</p></main><script>const bridge=window.__TasheelBridge;function logEvent(type,payload){if(bridge&&typeof bridge.sendInteraction==="function")bridge.sendInteraction({type,payload});}function showResult(){const ion=document.querySelector("#ion").value;const box=document.querySelector("#result");const data=ion==="Fe2+"?{name:"Fe(OH)2",color:"أبيض مخضر",eq:"Fe²⁺(aq)+2OH⁻(aq)→Fe(OH)₂(s)"}:{name:"Fe(OH)3",color:"بني محمر",eq:"Fe³⁺(aq)+3OH⁻(aq)→Fe(OH)₃(s)"};box.innerHTML="<strong>الملاحظة:</strong> يتكون راسب "+data.name+" "+data.color+"<p dir=\"ltr\">"+data.eq+"</p>";logEvent("iron-test-result",data);}document.addEventListener("DOMContentLoaded",()=>{document.querySelector("#run").addEventListener("click",showResult);if(bridge&&typeof bridge.markStarted==="function")bridge.markStarted({capability:"labExperimentHtml"});});</script></body></html>
