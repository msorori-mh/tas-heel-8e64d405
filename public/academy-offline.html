<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#173f5f" />
    <title>أكاديمية تمكين — لا يوجد اتصال</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        font-family: system-ui, "Segoe UI", sans-serif;
        color: #132238;
        background: #f5f7fa;
      }
      main {
        width: min(100%, 32rem);
        padding: 2rem;
        box-sizing: border-box;
        border: 1px solid #dce3ea;
        border-radius: 1.25rem;
        background: #fff;
        text-align: center;
        box-shadow: 0 18px 45px rgba(24, 49, 74, 0.09);
      }
      span {
        display: grid;
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1rem;
        place-items: center;
        border-radius: 1rem;
        color: #173f5f;
        background: #f4b942;
        font-size: 2rem;
      }
      h1 {
        font-size: 1.55rem;
      }
      p {
        color: #66758a;
        line-height: 1.8;
      }
      button {
        min-height: 3rem;
        padding: 0.7rem 1rem;
        border: 0;
        border-radius: 0.8rem;
        color: #fff;
        background: #173f5f;
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <span aria-hidden="true">ت</span>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        يمكن فتح واجهة الأكاديمية، لكن تسجيل الدخول والبرامج والمحاضرات تحتاج اتصالًا آمنًا
        بالإنترنت.
      </p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
