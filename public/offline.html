<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <title>غير متصل — تطبيق طلاب الثانوية</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f3ff;
        --text: #2d2640;
        --muted: #6b6280;
        --primary: #4f46e5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: "Cairo", Tahoma, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: var(--muted);
        font-size: 0.95rem;
      }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>غير متصل بالإنترنت</h1>
      <p>
        أنت غير متصل بالإنترنت حالياً. يرجى إعادة الاتصال لمتابعة التدريب والاختبارات.
      </p>
      <a href="/">إعادة المحاولة</a>
    </main>
  </body>
</html>
