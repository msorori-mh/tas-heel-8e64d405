<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E2A78" />
    <title>غير متصل — تمكين طلاب الثانوية</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #1e2a78;
        --muted: #5b6478;
        --primary: #1e2a78;
        --border: #e3e7f0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(1.5rem + env(safe-area-inset-top)) calc(1rem + env(safe-area-inset-right))
          calc(1.5rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left));
        font-family: "Cairo", Tahoma, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        width: 100%;
        max-width: 24rem;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        padding: 2rem 1.5rem;
        box-shadow: 0 8px 24px rgba(30, 42, 120, 0.08);
      }
      .badge {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1rem;
        border-radius: 1rem;
        background: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .badge svg {
        width: 1.75rem;
        height: 1.75rem;
        stroke: #ffffff;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        line-height: 1.7;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .note {
        margin-top: 0.75rem;
        font-size: 0.8rem;
      }
      .actions {
        margin-top: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      button,
      a.link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        border-radius: 0.75rem;
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
      }
      button {
        border: none;
        background: var(--primary);
        color: #ffffff;
      }
      a.link {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 9.5 12 4l10 5.5-10 5.5L2 9.5Z" />
          <path d="M6 12v4c0 1.5 2.7 3 6 3s6-1.5 6-3v-4" />
        </svg>
      </div>
      <h1>غير متصل بالإنترنت</h1>
      <p>أنت غير متصل حالياً. أعد الاتصال بالإنترنت لمتابعة الدروس والتدريب والاختبارات.</p>
      <p class="note">
        ملاحظة: الاختبارات والتدريب تتطلب اتصالاً بالإنترنت، ولا تُحفظ أو تُرسل الإجابات دون اتصال.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">إعادة المحاولة</button>
        <a class="link" href="/">العودة للرئيسية</a>
      </div>
    </main>
  </body>
</html>
